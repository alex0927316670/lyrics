plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.lrc.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.lrc.downloader'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 沒有正式簽章時，release 也用 debug 金鑰簽，方便直接安裝
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
