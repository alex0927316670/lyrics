plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.lrc.downloader'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.lrc.downloader'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '2.1'
    }

    // 固定簽章：每次 GitHub 編譯出的新版都能直接覆蓋安裝（不用先移除舊版）
    signingConfigs {
        fixed {
            storeFile file('release.keystore')
            storePassword 'lrc123456'
            keyAlias 'lrc'
            keyPassword 'lrc123456'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
